<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Todo — microservices demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Todo list</h1>
    <p class="status" id="status">проверка соединения с бэкендом…</p>

    <form id="todo-form">
      <input id="todo-title" type="text" placeholder="Что нужно сделать?" autocomplete="off" required />
      <button type="submit">Добавить</button>
    </form>

    <ul id="todo-list"></ul>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
